# A small hotel network: one L3 core and two access switches.
# Guest, staff, POS and AP management traffic are kept on separate VLANs so a
# compromised guest device can never reach the payment terminals.

defaults:
  domain: hotel.lan
  dns_servers: [10.10.0.53, 1.1.1.1]
  ntp_servers: [ntp.nict.jp]
  timezone: { name: JST, offset: 9 }

groups:
  access:
    platform: cisco_ios
    vlans:
      - { id: 10, name: STAFF }
      - { id: 20, name: GUEST }
      - { id: 30, name: POS }
      - { id: 99, name: AP-MGMT }
      - { id: 999, name: NATIVE-UNUSED }

devices:
  - hostname: core-01
    platform: huawei_vrp
    host: 10.10.99.1
    vlans:
      - { id: 10, name: STAFF }
      - { id: 20, name: GUEST }
      - { id: 30, name: POS }
      - { id: 99, name: AP-MGMT }
      - { id: 999, name: NATIVE-UNUSED }
    svis:
      - { vlan: 10, ip: 10.10.10.1/24, dhcp_relay: 10.10.0.67 }
      - { vlan: 20, ip: 10.10.20.1/22, dhcp_relay: 10.10.0.67 }
      - { vlan: 30, ip: 10.10.30.1/27 }
      - { vlan: 99, ip: 10.10.99.1/24 }
    interfaces:
      - name: GigabitEthernet0/0/1
        description: uplink-to-access-lobby
        mode: trunk
        native_vlan: 999
        allowed_vlans: [10, 20, 30, 99]
      - name: GigabitEthernet0/0/2
        description: uplink-to-access-annex
        mode: trunk
        native_vlan: 999
        allowed_vlans: [10, 20, 99]
      - name: GigabitEthernet0/0/24
        description: wan-router
        mode: routed
        ip: 203.0.113.2/30
    default_gateway: 203.0.113.1

  - hostname: acc-lobby-01
    group: access
    host: 10.10.99.11
    default_gateway: 10.10.99.1
    svis:
      - { vlan: 99, ip: 10.10.99.11/24, description: management }
    interfaces:
      - { name: GigabitEthernet1/0/1, description: ap-lobby-01, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 99], poe: true }
      - { name: GigabitEthernet1/0/2, description: ap-lobby-02, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 99], poe: true }
      - { name: GigabitEthernet1/0/10, description: front-desk-pc, mode: access, vlan: 10 }
      - { name: GigabitEthernet1/0/11, description: pos-terminal-01, mode: access, vlan: 30 }
      - { name: GigabitEthernet1/0/12, description: unused, mode: shutdown }
      - { name: GigabitEthernet1/0/48, description: uplink-core-01, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 30, 99] }

  - hostname: acc-annex-01
    group: access
    host: 10.10.99.12
    default_gateway: 10.10.99.1
    svis:
      - { vlan: 99, ip: 10.10.99.12/24, description: management }
    interfaces:
      - { name: GigabitEthernet1/0/1, description: ap-annex-01, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 99], poe: true }
      - { name: GigabitEthernet1/0/48, description: uplink-core-01, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 99] }
